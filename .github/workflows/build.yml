name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Smoke-test uitvoeren (MSI installeren, converteren, deïnstalleren)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test, MSI en smoke-test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # De eigenaar van deze repository heeft de WiX v7 OSMF EULA geaccepteerd.
      ANSIWATCH_ACCEPT_WIX_EULA: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: build.ps1 (tests, publish, MSI)
        shell: pwsh
        run: ./build.ps1

      - name: Versie bepalen
        id: version
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts -Filter 'AnsiWatch-*.msi' | Select-Object -First 1
          $version = $msi.BaseName -replace '^AnsiWatch-', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "### AnsiWatch $version" >> $env:GITHUB_STEP_SUMMARY
          "MSI: ``$($msi.Name)`` ($([math]::Round($msi.Length / 1MB, 1)) MB)  " >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$((Get-FileHash $msi.FullName -Algorithm SHA256).Hash)``" >> $env:GITHUB_STEP_SUMMARY

      # De MSI direct na de build als eigen artifact, zodat hij ook beschikbaar is als de smoke-test faalt.
      - name: MSI uploaden
        uses: actions/upload-artifact@v4
        with:
          name: AnsiWatch-${{ steps.version.outputs.version }}-msi
          path: |
            artifacts/AnsiWatch-*.msi
            artifacts/AnsiWatch-*.msi.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Smoke-test MSI (installeren, converteren, deïnstalleren)
        if: github.event_name != 'workflow_dispatch' || inputs.smoke_test
        shell: pwsh
        run: ./tests/smoke/Invoke-SmokeTest.ps1 -Msi (Get-ChildItem artifacts -Filter 'AnsiWatch-*.msi').FullName

      - name: Test- en smoke-logs uploaden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            artifacts/test-results/**
            artifacts/smoke/**
          if-no-files-found: ignore

  linux:
    name: Unit- en integratietests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/AnsiWatch.Tests/AnsiWatch.Tests.csproj -c Release
